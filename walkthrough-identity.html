  :root{

    --line:#E1E7DB; --green:#256521; --green-ink:#1A3A16; --bright:#8BC638;
    --good:#16A34A; --good-soft:#E4F2DC; --warn:#B26A00; --warn-soft:#FBF0D0; --danger:#C0392B; --danger-soft:#F7E1DD;
    --rust:#B4531F; --rust-soft:#FBEEE2; --purple:#5B44B8; --purple-soft:#EAE5FB; --info:#2A6AA6; --info-soft:#E1EDF7;
    --sel:#E8F1DF; --side:#12210E;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0C110A; --surface:#141A11; --surface-2:#1B2415; --ink:#EDF1EA; --soft:#A6AE9B; --faint:#6E7563;
    --line:#26301F; --green:#8BC638; --green-ink:#B6E06A; --bright:#8BC638;
    --good:#5CC08C; --good-soft:#173021; --warn:#E9C766; --warn-soft:#2C2410; --danger:#E4685C; --danger-soft:#38201C;
    --rust:#E0894F; --rust-soft:#2C2013; --purple:#B9A7F0; --purple-soft:#221B3A; --info:#6FA8DC; --info-soft:#122436;
    --sel:#20301A; --side:#0A130A;
  }}
  :root[data-theme="dark"]{
    --bg:#0C110A; --surface:#141A11; --surface-2:#1B2415; --ink:#EDF1EA; --soft:#A6AE9B; --faint:#6E7563;
    --line:#26301F; --green:#8BC638; --green-ink:#B6E06A; --bright:#8BC638;
    --good:#5CC08C; --good-soft:#173021; --warn:#E9C766; --warn-soft:#2C2410; --danger:#E4685C; --danger-soft:#38201C;
    --rust:#E0894F; --rust-soft:#2C2013; --purple:#B9A7F0; --purple-soft:#221B3A; --info:#6FA8DC; --info-soft:#122436;
    --sel:#20301A; --side:#0A130A;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:13px}
  .app{display:flex;height:100vh;min-height:640px}
  .side{width:206px;flex:0 0 auto;background:var(--side);color:#EAF1E6;padding:14px 11px;display:flex;flex-direction:column;gap:2px;overflow:auto}
  @media(max-width:760px){.side{width:58px}.side .brand .tt,.side .nav b .lb,.side .nav b .ct,.side .who{display:none}}
  .side .brand{display:flex;align-items:center;gap:9px;padding:5px 7px 6px}
  .side .brand .tt{line-height:1.1}
  .side .brand .tt b{font-family:var(--serif);font-size:15px;display:block}
  .side .brand .tt span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FA085}
  .side .nav b{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-weight:600;font-size:12.5px;color:#C4D2BC;cursor:pointer;transition:.12s}
  .side .nav b:hover{background:rgba(255,255,255,.06);color:#fff}
  .side .nav b.on{background:var(--green);color:#fff}
  .side .nav b svg{flex:0 0 auto}
  .side .nav b .lb{flex:1}
  .side .nav b .ct{font-size:10.5px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
  .side .who{margin-top:auto;font-size:10.5px;color:#8FA085;padding:9px 7px 2px;border-top:1px solid rgba(255,255,255,.08)}
  .side .who b{color:#fff;font-size:11.5px;display:block}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .hd{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .hd h1{font-family:var(--serif);font-size:19px;margin:0;display:flex;align-items:baseline;gap:9px}
  .hd h1 em{font-style:normal;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--faint)}
  .hd p{margin:3px 0 0;font-size:12px;color:var(--soft)}
  .body{flex:1;overflow:auto;padding:16px 20px 22px}
  .view{display:none}.view.on{display:block;animation:f .2s ease}
  @keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* chips / pills */
  .pchip{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .p-lo{background:var(--sel);color:var(--green-ink)} .p-cust{background:var(--rust-soft);color:var(--rust)} .p-con{background:var(--purple-soft);color:var(--purple)}
  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .ok{background:var(--good-soft);color:var(--good)} .warn{background:var(--warn-soft);color:var(--warn)}
  .bad{background:var(--danger-soft);color:var(--danger)} .info{background:var(--info-soft);color:var(--info)} .mut{background:var(--surface-2);color:var(--faint)}
  .tag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#8B6B00;background:#FBF0D0;padding:2px 7px;border-radius:999px}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#E9C766;background:#2C2410}}
  :root[data-theme="dark"] .tag{color:#E9C766;background:#2C2410}

  table{width:100%;border-collapse:collapse}
  th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
  tr:hover td{background:var(--surface-2)}
  .mono{font-family:var(--mono);font-size:11px;color:var(--soft)}

  /* users */
  .ugrid{display:grid;grid-template-columns:1fr 320px;gap:16px}
  @media(max-width:840px){.ugrid{grid-template-columns:1fr}}
  .filters{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:var(--surface);color:var(--soft);font-family:var(--sans);font-size:11.5px;font-weight:650;padding:6px 12px;border-radius:999px;cursor:pointer}
  .filters button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .urow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;font-family:var(--sans);color:var(--ink)}
  .urow:hover{background:var(--surface-2)}
  .urow.sel{background:var(--sel)}
  .av{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:600;font-size:14px}
  .urow .nm{flex:1;min-width:0}
  .urow .nm b{font-weight:650;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .urow .nm span{font-size:11px;color:var(--soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .urow .rt{text-align:right;flex:0 0 auto}
  .urow .rt .last{font-size:10.5px;color:var(--faint);display:block;margin-top:4px}

  .detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:0;align-self:start}
  .detail .dh{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .detail .dh b{font-size:15px;font-family:var(--serif)}
  .detail .dh span{font-size:11px;color:var(--soft);display:block}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
  .kv:last-of-type{border-bottom:none}
  .kv span{color:var(--soft)} .kv b{text-align:right;font-weight:600}
  .dlab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);margin:13px 0 7px}
  .acc{font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--line)}
  .acc:last-child{border-bottom:none}
  .acc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .acc .note{color:var(--soft);font-size:11px;margin-top:2px}
  .ses{font-size:11px;color:var(--soft);padding:5px 0;display:flex;gap:9px}
  .ses time{color:var(--faint);flex:0 0 84px;font-variant-numeric:tabular-nums}

  /* portal cards */
  .portals{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  @media(max-width:840px){.portals{grid-template-columns:1fr}}
  .pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .pcard .ph{padding:13px 15px;color:#fff}

  .pcard .pb{padding:13px 15px}
  .prow{padding:9px 0;border-bottom:1px solid var(--line)}

  .prow .v{font-size:12.5px;margin-top:3px}

  /* grants term */
  .term{font-variant-numeric:tabular-nums;font-size:12px}
  .term .to{color:var(--soft)}

  /* org */
  .orgcards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
  @media(max-width:760px){.orgcards{grid-template-columns:1fr}}

  .bc .bt{display:flex;justify-content:space-between;align-items:flex-start}
  .bc .bt b{font-family:var(--serif);font-size:16px} .bc .bt span{font-size:11px;color:var(--soft);display:block}
  .bc .stats{display:flex;gap:18px;margin-top:11px}
  .bc .stats .s b{font-family:var(--serif);font-size:20px;color:var(--green);display:block;line-height:1}
  .bc .stats .s span{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
  .states{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .st{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--soft)}

  /* licensing */
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 13px;font-size:11.5px;color:var(--soft)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .lg-lic{background:var(--sel);border:1px solid var(--green)} .lg-dscr{background:var(--warn-soft);border:1px solid var(--warn)}
  .stategrid{display:flex;flex-wrap:wrap;gap:6px}
  .scell{font-size:11px;font-weight:650;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
  .scell.lic{background:var(--sel);border-color:var(--green);color:var(--green-ink)}
  .scell.dscr::after{content:"·D";font-size:9px;color:var(--warn);font-weight:800;margin-left:3px}
  .note-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12px;color:var(--soft);line-height:1.5}
  .note-box b{color:var(--ink)}

  /* sessions */
  .srow .dev{font-weight:650}
  .revoke{border:1px solid var(--line);background:var(--surface);color:var(--danger);font-family:var(--sans);font-size:11px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer}
  .revoke:hover{background:var(--danger-soft)}

  /* audit */
  .acats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .acats button{border:1px solid var(--line);background:var(--surface);color:var(--soft);font-family:var(--sans);font-size:11px;font-weight:650;padding:6px 11px;border-radius:999px;cursor:pointer}
  .acats button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .arow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
  .arow .l1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .arow .l1 time{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11px;flex:0 0 auto}
  .arow .act{font-weight:650;font-size:12.5px}
  .arow .l2{font-size:11.5px;color:var(--soft);margin-top:5px}
  .cat{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px}
  .c-Access{background:var(--good-soft);color:var(--good)} .c-Config{background:var(--info-soft);color:var(--info)}
  .c-Identity{background:var(--purple-soft);color:var(--purple)} .c-Security{background:var(--danger-soft);color:var(--danger)} .c-Data{background:var(--warn-soft);color:var(--warn)}
  .changes{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;display:none}
  .arow.open .changes{display:block}
  .chg{display:flex;align-items:center;gap:8px;font-size:11px;padding:3px 0;font-variant-numeric:tabular-nums}
  .chg .fld{font-family:var(--mono);color:var(--soft);flex:0 0 auto}
  .chg .from{color:var(--faint);text-decoration:line-through} .chg .to{color:var(--green);font-weight:650}
  .chg .arr{color:var(--faint)}

  .toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(16px);background:var(--green-ink);color:#fff;font-weight:650;font-size:12.5px;padding:10px 16px;border-radius:11px;opacity:0;transition:.25s;pointer-events:none;z-index:5}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

      $("#body").querySelectorAll(".acats button").forEach(function(el){el.addEventListener("click",function(){aCat=el.getAttribute("data-c");render();})});
